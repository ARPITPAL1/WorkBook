<!-- Reusable Global Delete Confirmation Modal -->
<div class="modal fade" id="reusableDeleteModal" tabindex="-1" aria-labelledby="reusableDeleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title font-heading fw-bold" id="reusableDeleteModalLabel">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> <span id="reusableDeleteModalTitle">Confirm Deletion</span>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="reusableDeleteForm" method="POST" action="">
        {% csrf_token %}
        <div id="reusableDeleteHiddenInputs"></div>
        <div class="modal-body p-4 text-start">
          <p class="mb-2" id="reusableDeleteMessage">Are you sure you want to delete this record?</p>
          <div id="reusableDeleteDetails" class="bg-light p-3 rounded-3 mb-3 border small" style="display:none;"></div>
          <div class="alert alert-warning small mb-0" id="reusableDeleteWarning">
            <i class="bi bi-info-circle me-1"></i> <span id="reusableDeleteWarningText">This action cannot be undone. Associated records and financial balances may be affected.</span>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger px-4" id="reusableDeleteSubmitBtn">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
/**
 * Global Delete Confirmation & Native Confirm Interceptor
 * Ensures all deletions use Bootstrap 5 modals and prevents browser confirm() blocking.
 */
document.addEventListener('DOMContentLoaded', function () {
  const modalEl = document.getElementById('reusableDeleteModal');
  if (!modalEl) return;

  const form = document.getElementById('reusableDeleteForm');
  const titleEl = document.getElementById('reusableDeleteModalTitle');
  const messageEl = document.getElementById('reusableDeleteMessage');
  const detailsEl = document.getElementById('reusableDeleteDetails');
  const warningEl = document.getElementById('reusableDeleteWarningText');
  const submitBtn = document.getElementById('reusableDeleteSubmitBtn');
  const hiddenContainer = document.getElementById('reusableDeleteHiddenInputs');

  let pendingFormToSubmit = null;

  // 1. Handle elements configured with data-confirm-delete
  document.addEventListener('click', function (e) {
    const trigger = e.target.closest('[data-confirm-delete]');
    if (!trigger) return;

    e.preventDefault();
    pendingFormToSubmit = null;

    const actionUrl = trigger.getAttribute('data-action-url') || '';
    const actionName = trigger.getAttribute('data-action') || '';
    const idField = trigger.getAttribute('data-id-field') || '';
    const idValue = trigger.getAttribute('data-id-value') || '';
    const title = trigger.getAttribute('data-title') || 'Confirm Deletion';
    const message = trigger.getAttribute('data-message') || 'Are you sure you want to delete this item?';
    const details = trigger.getAttribute('data-details') || '';
    const warning = trigger.getAttribute('data-warning') || 'This action cannot be undone.';
    const btnText = trigger.getAttribute('data-btn-text') || 'Delete';

    form.action = actionUrl;
    titleEl.textContent = title;
    messageEl.innerHTML = message;
    submitBtn.textContent = btnText;
    warningEl.textContent = warning;

    if (details) {
      detailsEl.innerHTML = details;
      detailsEl.style.display = 'block';
    } else {
      detailsEl.style.display = 'none';
      detailsEl.innerHTML = '';
    }

    hiddenContainer.innerHTML = '';
    if (actionName) {
      const actInput = document.createElement('input');
      actInput.type = 'hidden';
      actInput.name = 'action';
      actInput.value = actionName;
      hiddenContainer.appendChild(actInput);
    }
    if (idField && idValue) {
      const idInput = document.createElement('input');
      idInput.type = 'hidden';
      idInput.name = idField;
      idInput.value = idValue;
      hiddenContainer.appendChild(idInput);
    }

    const bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
    bsModal.show();
  });

  // 2. Intercept any existing forms that might still have onsubmit="return confirm(...)"
  document.addEventListener('submit', function (e) {
    const targetForm = e.target;
    if (targetForm === form) {
      // Reusable form itself is submitting
      return;
    }

    // Check if the form was already approved
    if (targetForm.dataset.modalConfirmed === 'true') {
      return;
    }

    // Check if form has onsubmit with confirm
    const onsubmitAttr = targetForm.getAttribute('onsubmit') || '';
    if (onsubmitAttr.includes('confirm(')) {
      e.preventDefault();
      e.stopImmediatePropagation();

      // Extract message from confirm('...')
      let promptMsg = 'Are you sure you want to proceed with this action?';
      const match = onsubmitAttr.match(/confirm\s*\(\s*['"]([^'"]+)['"]\s*\)/);
      if (match && match[1]) {
        promptMsg = match[1];
      }

      pendingFormToSubmit = targetForm;
      titleEl.textContent = 'Confirm Action';
      messageEl.textContent = promptMsg;
      detailsEl.style.display = 'none';
      warningEl.textContent = 'This action cannot be undone.';
      submitBtn.textContent = 'Confirm';

      const bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
      bsModal.show();
    }
  }, true);

  // When submitting from intercept
  form.addEventListener('submit', function (e) {
    if (pendingFormToSubmit) {
      e.preventDefault();
      const formToSubmit = pendingFormToSubmit;
      pendingFormToSubmit = null;
      formToSubmit.dataset.modalConfirmed = 'true';

      const bsModal = bootstrap.Modal.getInstance(modalEl);
      if (bsModal) bsModal.hide();

      // Trigger actual submit
      formToSubmit.submit();
    }
  });
});
</script>
